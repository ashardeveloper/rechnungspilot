services:
  postgres:
    image: postgres:17-alpine
    container_name: rechnungspilot-postgres
    environment:
      POSTGRES_DB: rechnungspilot
      POSTGRES_USER: rechnungspilot
      POSTGRES_PASSWORD: rechnungspilot
    ports:
      - "5433:5432"
    volumes:
      - rechnungspilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechnungspilot -d rechnungspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rechnungspilot-postgres-data:
